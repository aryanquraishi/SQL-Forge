services:
  - type: web
    name: terra-sql-studio
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20
    plan: free
